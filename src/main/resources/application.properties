spring.application.name=figuras

# Paquete que se escanea al arrancar para registrar las figuras nativas
figuras.paquete-nativas=com.udla.figuras.model

# Carpeta donde se guardan los .groovy aceptados (se recargan al arrancar)
figuras.groovy.dir=./figuras-groovy

# Catálogo externo de figuras. Por defecto apunta al catálogo simulado de esta misma aplicación.
# Si cambia server.port, cambie también el puerto de esta URL.
# Para usar un servicio real: figuras.catalogo.url=https://mi-servicio.example.com y
# figuras.catalogo.mock.enabled=false (ver README).
figuras.catalogo.url=http://localhost:8080/mock-catalogo
figuras.catalogo.timeout-ms=3000
figuras.catalogo.mock.enabled=true
# Ejemplos de resources/ejemplos que el catálogo simulado NO ofrece (separados por comas)
figuras.catalogo.mock.excluidos=Malicioso
